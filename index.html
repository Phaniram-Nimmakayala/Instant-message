<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Instant Message App</title>
        <link rel="stylesheet" href="style.css">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    </head>
    <body>
        <div class="app">
        <form>
            <div><i class='bx bxl-whatsapp'></i></div>
            <input type="text" id="name" name="name" placeholder="Enter name" required>
            <textarea id="msg" name="msg" rows="5" cols="40" placeholder="Type message here..." required></textarea>
            <button type="submit"><i class='bx bx-play'></i></button>
        </form>
        <footer>
            <p>Designed by <span>Phani ram</span></p>
        </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
